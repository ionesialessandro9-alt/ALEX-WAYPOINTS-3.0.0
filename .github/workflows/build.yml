
name: Build ALEX Waypoints 3.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-mod:
    name: Build Fabric Mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Locate project
        shell: bash
        run: |
          echo "Cartelle trovate:"
          find . -name settings.gradle -print
          DIR=$(find . -name settings.gradle -not -path '*/.gradle/*' | head -n 1)
          if [ -z "$DIR" ]; then
            echo "ERRORE: settings.gradle non trovato"
            exit 1
          fi
          cd "$(dirname "$DIR")"
          gradle build

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: ALEX-Waypoints-Fabric-Mod
          path: '**/build/libs/*.jar'
          if-no-files-found: error

  build-overlay:
    name: Build Desktop Companion
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Locate and build overlay
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path . -Filter requirements.txt -Recurse |
            Where-Object { $_.FullName -match 'overlay' } |
            Select-Object -First 1

          if (-not $file) {
            throw "requirements.txt non trovato nella cartella overlay"
          }

          Set-Location $file.DirectoryName
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          pyinstaller --onefile --windowed alex_overlay.py

          if (-not (Test-Path "dist/alex_overlay.exe")) {
            throw "EXE non generato"
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ALEX-Waypoints-Desktop
          path: '**/dist/alex_overlay.exe'
          if-no-files-found: error

          name: ALEX-Waypoints-Desktop
          path: '**/dist/alex_overlay.exe'
