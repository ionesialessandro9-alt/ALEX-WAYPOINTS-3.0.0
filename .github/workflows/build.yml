name: Build ALEX Waypoints 3.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-mod:
    name: Build Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build mod
        working-directory: fabric-mod
        run: gradle build

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: ALEX-Waypoints-Fabric-Mod
          path: fabric-mod/build/libs/*.jar

  build-overlay:
    name: Build Desktop Companion
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: overlay
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        working-directory: overlay
        run: pyinstaller --onefile --windowed alex_overlay.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ALEX-Waypoints-Desktop
          path: overlay/dist/alex_overlay.exe
