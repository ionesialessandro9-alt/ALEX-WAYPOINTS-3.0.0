
name: Build ALEX Waypoints 3.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-mod:
    name: Build Fabric Mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Find and build mod
        shell: bash
        run: |
          DIR=$(find . -name settings.gradle -not -path '*/.gradle/*' | head -n 1)
          cd "$(dirname "$DIR")"
          gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: ALEX-Waypoints-Fabric-Mod
          path: '**/build/libs/*.jar'

  build-overlay:
    name: Build Desktop Companion
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find overlay and install dependencies
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path . -Filter requirements.txt -Recurse | Where-Object { $_.FullName -match 'overlay' } | Select-Object -First 1
          if (-not $file) { throw "Cartella overlay non trovata" }
          Set-Location $file.DirectoryName
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --onefile --windowed alex_overlay.py
          "OVERLAY_DIR=$($file.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ALEX-Waypoints-Desktop
          path: '**/dist/alex_overlay.exe'
