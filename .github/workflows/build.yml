
name: Build ALEX Waypoints 3.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-mod:
    name: Build Fabric Mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build mod
        working-directory: ALEX_Waypoints_3_0_Dawn_1.21.8/fabric-mod
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: ALEX-Waypoints-Fabric-Mod
          path: ALEX_Waypoints_3_0_Dawn_1.21.8/fabric-mod/build/libs/*.jar

  build-overlay:
    name: Build Desktop Companion
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ALEX_Waypoints_3_0_Dawn_1.21.8/overlay
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        working-directory: ALEX_Waypoints_3_0_Dawn_1.21.8/overlay
        run: pyinstaller --onefile --windowed alex_overlay.py

      - uses: actions/upload-artifact@v4
        with:
          name: ALEX-Waypoints-Desktop
          path: ALEX_Waypoints_3_0_Dawn_1.21.8/overlay/dist/alex_overlay.exe

